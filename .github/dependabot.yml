version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    ignore:
      # TS 7.x is the native-compiler generation — a deliberate migration
      # task (its first dependabot PR failed typecheck same-minute), not a
      # routine bump. Revisit intentionally.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
