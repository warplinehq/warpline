name: Link check

# ADVISORY, and deliberately not part of the required set.
#
# External link checking is network-nondeterministic: a third-party site that
# is down, rate-limiting, or behind a bot wall turns a green branch red for a
# reason the author cannot fix. Every deterministic doc check lives in
# `bun test` instead, where red always means "you broke something".
#
# What this must NOT do is buy its own green: lychee documents
# `--accept 200,429` and `--max-retries 0` as a rate-limit workaround, and both
# make a throttled run pass while checking less. Caching plus the repo token is
# the honest fix, so that is what is configured here.
on:
  schedule:
    - cron: '0 9 1 * *'
  pull_request:
    paths: ['**/*.md', '.github/workflows/link-check.yml']
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: link-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lychee:
    runs-on: ubuntu-latest
    continue-on-error: true # advisory: never blocks a merge
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Restore lychee cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .lycheecache
          key: lychee-${{ github.sha }}
          restore-keys: lychee-
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --cache
            --max-cache-age 1d
            --no-progress
            --exclude-path node_modules
            --exclude-path dist
            './**/*.md'
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
