name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      # dist/ must exist before the tests and the typecheck: examples/plugins/*
      # import `warpline/schemas/*` and `warpline/lib/paths`, which resolve by
      # package self-reference through the exports map into dist/.
      - run: bun run build
      # Sharded per top-level src dir with --timeout 20000, inherited from the
      # source repo's hard-won pattern: mock.module is process-global (sharding
      # isolates cross-dir leaks) and bun's 5s default timeout flakes ~3% under
      # CPU contention (bunfig [test] timeout is silently ignored; the CLI flag
      # is the only suite-wide control). Overkill at this size; correct at the
      # size this repo is headed for.
      # examples/ is a shard of its own: its tests live outside src/, so the
      # find-derived loop never reached them and 9 tests ran nowhere.
      - name: test (sharded)
        run: |
          rc=0
          for shard in $(cd src && find . -name '*.test.ts' | sed -E 's|^\./||; s|/.*||' | sort -u); do
            echo "== shard: $shard"
            bun test "./src/$shard" --timeout 20000 || rc=1
          done
          echo "== shard: examples"
          bun test ./examples --timeout 20000 || rc=1
          exit $rc
      - run: bunx tsc --noEmit
      # The publishable artifact, produced on every run rather than only before
      # a release. The `prepack` script rebuilds dist/ as part of packing, so
      # what gets measured and handed on is always built from this commit
      # (T-02-04), and the whitelist check catches a `files` regression on the
      # push that introduces it rather than at publish time (T-02-01).
      - name: produce the publishable artifact
        run: npm pack
      - name: check the artifact against the whitelist
        run: bash scripts/assert-pack-whitelist.sh
      # Handed to the next job as an artifact rather than rebuilt there: this
      # repo carries bun.lock and no package-lock.json, so a Node-only
      # container has nothing to install from (D-25). The side benefit is the
      # better property — the next job exercises the exact bytes a publish
      # would upload, not an equivalent rebuild.
      - name: hand the artifact to the next job
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: npm-tarball
          path: warpline-*.tgz
          if-no-files-found: error
