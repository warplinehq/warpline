name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-generated:
    # The generated manifest table is the one place a doc is derived from code
    # rather than checked against it. Regenerate and diff: a schema change that
    # forgets the doc fails here instead of merging. Deterministic and offline,
    # so it is a required check, not advisory.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - run: bun run docs:generate
      - name: fail if the generated docs are stale
        run: |
          if ! git diff --exit-code -- docs/; then
            echo "::error::docs/ is stale. Run 'bun run docs:generate' and commit the result." >&2
            exit 1
          fi

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      # dist/ must exist before the tests and the typecheck: examples/plugins/*
      # import `warpline/schemas/*` and `warpline/lib/paths`, which resolve by
      # package self-reference through the exports map into dist/.
      - run: bun run build
      # Sharded per top-level src dir with --timeout 20000, inherited from the
      # source repo's hard-won pattern: mock.module is process-global (sharding
      # isolates cross-dir leaks) and bun's 5s default timeout flakes ~3% under
      # CPU contention (bunfig [test] timeout is silently ignored; the CLI flag
      # is the only suite-wide control). Overkill at this size; correct at the
      # size this repo is headed for.
      # examples/ is a shard of its own: its tests live outside src/, so the
      # find-derived loop never reached them and 9 tests ran nowhere.
      - name: test (sharded)
        run: |
          rc=0
          for shard in $(cd src && find . -name '*.test.ts' | sed -E 's|^\./||; s|/.*||' | sort -u); do
            echo "== shard: $shard"
            bun test "./src/$shard" --timeout 20000 || rc=1
          done
          echo "== shard: examples"
          bun test ./examples --timeout 20000 || rc=1
          exit $rc
      - run: bunx tsc --noEmit
      # The publishable artifact, produced on every run rather than only before
      # a release. The `prepack` script rebuilds dist/ as part of packing, so
      # what gets measured and handed on is always built from this commit
      # and the whitelist check catches a `files` regression on the push that
      # introduces it rather than at publish time.
      - name: produce the publishable artifact
        run: npm pack
      - name: check the artifact against the whitelist
        run: bash scripts/assert-pack-whitelist.sh
      # Handed to the next job as an artifact rather than rebuilt there: this
      # repo carries bun.lock and no package-lock.json, so a Node-only
      # container has nothing to install from. The side benefit is the
      # better property — the next job exercises the exact bytes a publish
      # would upload, not an equivalent rebuild.
      - name: hand the artifact to the next job
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: npm-tarball
          path: warpline-*.tgz
          if-no-files-found: error

  # The "runs on Node alone" claim, tested rather than asserted. No checkout
  # step on purpose: the absence of a source tree is half of what is under
  # test. Running this as a container invocation from inside the bun job is
  # rejected — a lookup on the host is meaningless when the absence is the
  # whole requirement.
  smoke:
    needs: test
    runs-on: ubuntu-latest
    container: node:22
    steps:
      # First, and fatal. A green result from a job that quietly ran with bun
      # available would be a false green, which is worse than no job at all
      - name: assert the runtime under test is absent
        run: |
          if command -v bun; then
            echo "bun is present — this job's entire premise is its absence" >&2
            exit 1
          fi
          echo "no bun on PATH"
      # Printed, not inferred: a floor regression should be visible in the log.
      # The image tag sits inside the supported range's first half; the range's
      # negative half rests on the official version-history table rather than
      # on execution, and this job is where a matrix leg would belong if a
      # stronger guarantee were ever wanted.
      - name: report the node the container provides
        run: node --version
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: npm-tarball
      - name: install the packed tarball globally
        run: npm i -g ./warpline-*.tgz
      - name: the usage banner
        run: warpline --help
      # With no plugins installed, this prints its no-plugins-installed message
      # naming the resolved directory and exits 0 — the documented behaviour,
      # so a non-zero exit here is a real failure and not an empty-state quirk.
      - name: the read-only preview
        run: warpline plan
