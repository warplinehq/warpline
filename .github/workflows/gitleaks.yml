name: Secret scan

# The standing half of the credential check. The pre-flight scan before the
# repository went public was a one-time pass over the whole history; this is
# the part that runs afterwards, over the commit history, on every branch.
#
# History, not working tree — reversed 2026-08-29, and the previous comment
# here argued the opposite, so here is why it was wrong.
#
# The old reasoning was that history does not change, so re-walking it buys
# nothing, and the default shallow checkout is what makes a tree scan correct.
# History does not change, but it does GROW, and the growth is the hole. A
# secret committed in A and removed in B, pushed together, leaves a working
# tree at HEAD that is clean. `gitleaks dir .` reads that tree, finds nothing,
# and the job is green forever while the secret sits in the published history
# where anyone can `git log -p` it. Measured, not reasoned: on a three-commit
# repository built to that shape, `dir` exits 0 and `git` exits 2.
#
# The cost argument was also backwards. Measured on this repository at 210
# commits: `gitleaks git .` takes 0.34s, `gitleaks dir .` takes 1.24s. Scanning
# the whole history is roughly four times CHEAPER than scanning the tree,
# because the pack is compressed and the tree is not.
#
# One step, not two. In CI the checkout contains only tracked files, so every
# byte `dir` would scan was introduced by some commit that `git` already reads.
# Keeping both would only re-add the false positive: `gitleaks dir .` in a real
# working clone exits 2 on the untracked, gitignored `.planning/` tree, which is
# why local and CI disagreed before (04-REVIEW WR-02).
#
# Every branch, not just main, also on purpose: a scan that has never been
# observed catching anything is a claim, not a capability, and the proof runs
# on a scratch branch.
#
# The gitleaks CLI rather than the GitHub Marketplace action: the action
# requires a licence key for organization-owned repositories, which would mean
# a long-lived secret in this repository's settings — the thing release.yml
# went to OIDC to avoid. The CLI is MIT-licensed and needs nothing.
#
# NOT advisory, unlike link-check.yml. That job is advisory because third-party
# websites are nondeterministic and red there does not mean "you broke
# something". This is offline and deterministic: red means a secret is in the
# tree — which is link-check.yml's own stated criterion for a required check.
# Nothing on main requires a status check, so this still gates no merge.
on:
  push:
  pull_request:
  schedule:
    - cron: '41 5 * * 3' # Wednesdays 05:41 UTC — staggered against the others
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: gitleaks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 is load-bearing now, not optional. A shallow checkout
      # gives `gitleaks git` only the tip commit to walk, which would silently
      # reduce this job to the tree scan it just replaced — green for the same
      # wrong reason, with no error to notice.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Version and checksum both in the diff, for the same reason every action
      # here carries a SHA: a release asset can be replaced, a checksum cannot
      # be replaced quietly. Both values reach the shell through the step
      # environment, never through workflow expression interpolation.
      - name: install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks

      # Redaction is on because this log is public. The config path is passed
      # explicitly rather than relying on path auto-detection, so a future move
      # of the config file fails loudly instead of silently falling back to the
      # built-in rules. The leak exit code is set to 2 so "found a secret" and
      # "gitleaks itself broke" are distinguishable: gitleaks returns 1 for
      # both by default, and this repository's pre-flight gate already uses 2
      # for the same reason.
      # `git` rather than `dir`: see the header. `.gitleaksignore` is committed
      # and empty on purpose — gitleaks suppresses findings by fingerprint from
      # that file, so an empty tracked one makes every future suppression show
      # up as a reviewable diff instead of as a finding that quietly stops
      # appearing.
      - name: scan the commit history
        run: ./gitleaks git . --config .gitleaks.toml --redact --exit-code 2 --no-banner --verbose
